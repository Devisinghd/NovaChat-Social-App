{% extends 'users/base.html' %}

{% block body %}
<h1 class="text-2xl font-bold mb-4">Login User🧑‍🦲</h1>
<div class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto px-4 pt-6 pb-8 mb-4">
    <form action="" method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class='block text-gray-700 text-sm font-bold mb-2' for="">Username</label>
            <div class="mb-4 shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ form.username }}</div>
        </div>
        <div class="mb-4">
            <label class='block text-gray-700 text-sm font-bold mb-2' for="">Password</label>
            <div class="mb-4 shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">{{ form.password }}</div>
        </div>
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Login</button>
    </form>
    <p class="text-center text-sm text-gray-600">
        <a href="{% url 'password_reset' %}">Forgot your password?</a>
    </p>
</div>

{% endblock %}
