<h1>we have sent you a verification email! Check your inbox.</h1>
<form method="post" class="mx-auto w-full max-w-md space-y-4 text-left">
        {% csrf_token %}
        {{ form.code }}
        {% for error in form.code.errors %}<p class="text-sm text-rose-600">{{ error }}</p>{% endfor %}
        <button type="submit" class="w-full rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-sm shadow-blue-600/20 hover:bg-blue-700">Verify code</button>
</form>
