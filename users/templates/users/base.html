{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}NovaChat{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'users/styles.css' %}">
    </head>
    <body>
        <nav class="site-nav">
            <div class="nav-inner">
                <a class="brand" href="{% url 'index' %}">
                    <img src="{% static 'users/images/social.png' %}" alt="NovaChat logo">
                    <span>NovaChat</span>
                </a>
                <div class="account-links">
                    {% if request.user.is_authenticated %}
                        <span class="welcome">Hi, {{ request.user.username }}</span>
                        <a href="{% url 'logout' %}">Log out</a>
                    {% else %}
                        <a href="{% url 'login' %}">Log in</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="page-shell">
            {% block body %}{% endblock %}
        </main>
    </body>
</html>
