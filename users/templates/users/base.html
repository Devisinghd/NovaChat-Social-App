{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    {% if request.user.is_authenticated %}
        <p>Welcome, {{ request.user.username }}!</p>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Log in</a>
    {% endif %}
    {% block body %}
    {% endblock %}
</body>
</html>
