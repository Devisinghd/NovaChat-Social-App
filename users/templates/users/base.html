{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}NovaChat{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'users/styles.css' %}">
    </head>
    <body>
        <nav class="site-nav" role="navigation" aria-label="Main navigation">
            <div class="nav-inner flex">
                <div>
                <a class="brand flex" href="{% url 'index' %}">
                    <img class="logo h-8 mr-2" src="{% static 'users/images/social.png' %}" alt="NovaChat logo">
                    <span class='font-semibold text-lg text-gray-800'>NovaChat</span>
                </a>
                </div>

                <div class="nav-links flex">
                     {% if request.user.is_authenticated %}
                        <a class='py-4 px-2' href="{% url 'logout' %}">Logout</a>
                    {% else %}
                        <a class='py-4 px-2' href="{% url 'login' %}">Log in</a>
                    {% endif %}
                    <a class='py-4 px-2' href="">Link 3</a>
        
                </div>
            </div>
        </nav>
        <main class="page-shell">
            {% block body %}{% endblock %}
        </main>
    </body>
</html>
